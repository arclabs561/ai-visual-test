<!DOCTYPE html><html><head>
    <title>Error: 0</title>
    <style type="text/css">
        body
        {
            background-color: #FFF;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            font-size: 14px;
            font-weight: normal;
            letter-spacing: normal;
            text-transform: none;
            word-spacing: normal;
            padding: 0;
            margin: 0;
        }

        a
        {
            color: #0066b3;
        }

        div.ClientLog
        {
            padding: 10px;
            background: #0066b3;
            font-weight: bold;
            color: #FFF;
            font-family: Arial;
            font-size: 12pt;
        }

            div.ClientLog a
            {
                text-decoration: underline;
                color: #FFF;
                background: #00579A;
                padding: 5px;
                border-radius: 2px;
                border: 1px solid #AAA;
            }

        div.SubmissionForm
        {
            padding: 20px;
            max-width: 1000px;
            box-sizing: border-box;
        }

            div.SubmissionForm label
            {
                font-weight: bold;
            }

            div.SubmissionForm textarea
            {
                height: 150px;
                width: 100%;
                border: 1px solid #a9a9a9;
                font: inherit;
                display: block;
                white-space: pre-wrap;
                background: #d0ffba;
                color: #000;
                box-sizing: border-box;
            }

            div.SubmissionForm input[type='submit']
            {
                float: right;
                padding: 5px;
                font-size: 1em;
                width: auto;
                height: auto;
                margin-top: 5px;
                background: #00579A;
                border: 1px solid #AAA;
                border-radius: 2px;
                color: #FFF;
            }

        div.StackTraceTitle
        {
            font-weight: bold;
            margin: 20px 20px 10px 20px;
        }

        div.StackTrace
        {
            white-space: pre-wrap;
            font-size: 8.25pt;
            font-family: monospace;
            padding: 0 20px;
        }

        div#SubmitInstructions
        {
            font-size: 1.5em;
            margin-bottom: 1.0em;
        }

        div.Submitted
        {
            font-size: 1.2em;
            margin-bottom: 1.0em;
        }

        div.GoBackLink
        {
            font-size: 1.2em;
            margin: 1em 0;
            font-weight: bold;
        }

        div.clearer
        {
            clear: both;
        }
    </style>
</head>
<body>
    <div class="ClientLog">
        Client Log Key: 0
    </div>
    <div class="SubmissionForm">
        
    </div>

</body></html>
