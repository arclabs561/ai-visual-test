<!DOCTYPE html><html><head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'none'; object-src 'none'; connect-src *;">
		<title>gamja IRC client</title>
		<link rel="stylesheet" href="./style.css">
		<script type="module" src="./main.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="manifest" href="manifest.json">
	</head>
	<body><section id="connect"><form><h2>Connect to IRC</h2><label>Nickname:<br><input type="username" name="nick" required=""></label><br><br><label>Password:<br><input type="password" name="password" placeholder="(optional)"></label><br><br><label><input type="checkbox" name="autojoin">Auto-join channel <strong>#chat</strong></label><br><br><label><input type="checkbox" name="rememberMe">Remember me</label><br><br><details><summary role="button">Advanced options</summary><br><label>Username:<br><input type="username" name="username" placeholder="Same as nickname"></label><br><br><label>Real name:<br><input type="text" name="realname" placeholder="Same as nickname"></label><br><br><label>Server password:<br><input type="text" name="pass" placeholder="None"></label><br><br></details><br><button>Connect</button></form></section>
		<noscript>
			<p>This application requires JavaScript. Please enable it!</p>
		</noscript>
	

</body></html>
