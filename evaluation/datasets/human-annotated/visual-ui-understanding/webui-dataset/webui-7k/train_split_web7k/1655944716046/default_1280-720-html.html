<body class="o-app t-hub">
<main>
    <!-- AUP Notice -->
    <style>
        .aup-notice {
            background-color: #2d7ebf;
            width: 50%;
            margin: 0 auto;
            position: relative;
            display: flex;
            left: 0;
            top: 0;
            align-items: center;
            font-size: 14px;
            padding: 7px 0;
            height: auto;
            z-index: 100;
        }
        .aup-notice p { margin: 0 auto; }
        .aup-notice .c-notification__content {
            white-space: normal;
            text-align: center;
            line-height: 1.23;
            min-height: 24px;
            display: flex;
            align-items: center;
        }
        .aup-notice.c-notification--alert .c-notification__content--has-icon .e-rhombicon {
            top: 0 !important;
        }
        @media screen and (max-width: 768px){
            .c-modal {
                height: calc(100% - 230px) !important;
            }
            .aup-notice {
                top: 10px !important;
            }
        }
        @media screen and (max-height: 500px){
            .aup-notice {
                top: 10px !important;
            }
            .c-modal {
                height: auto !important;
                margin-top: 50px;
            }
        }
        @media screen and (max-height: 600px){
            .c-modal {
                height: auto !important;
                margin-top: 75px;
            }
        }

    </style>
    <div class="c-notification c-notification--alert t-notification--primary aup-notice" role="notification">
        <div class="c-notification__content c-notification__content--has-icon">
            <svg class="e-rhombicon e-rhombicon--information u-icon-medium" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" enable-background="new 0 0 40 40">
                <path d="M18.8 18.34h2.38v8.73H18.8v-8.73zM36 20c0 8.82-7.18 16-16 16S4 28.82 4 20 11.18 4 20 4s16 7.18 16 16zm-1.88 0c0-7.78-6.33-14.12-14.12-14.12S5.88 12.22 5.88 20c0 7.78 6.33 14.12 14.12 14.12S34.12 27.78 34.12 20zM20 12.92c-.86 0-1.3.39-1.3 1.16 0 .78.43 1.17 1.3 1.17.43 0 .76-.1.97-.31.22-.21.32-.49.32-.86.01-.77-.43-1.16-1.29-1.16z"></path>
            </svg>
            <p>
                <strong>Attention!</strong>  Our <abbr title="Acceptable Use Policy">AUP</abbr> has changed, please <a href="/bundles/hyndgatewayv1/Login/Default/FT Platform Acceptable Use policy v1.3.pdf" target="_BLANK">click here</a> to download/view the new policy.
            </p>
        </div>
    </div>

            <h4 class="c-modal__header--product">flashtalking<span>hub</span></h4>
        </div>
                <div class="c-modal__content u-margin-around--medium">
            <form id="login" class="e-form" action="/oauth/v2/auth_login_check" method="post">
                <fieldset>
                    <label for="username">Username</label>
                    <div class="e-form__control">
                        <svg class="e-rhombicon e-rhombicon--user e-form__control--icon e-form__control--icon-left u-icon-medium" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" enable-background="new 0 0 40 40"><path d="M27.2 20.82c1.23-1.82 1.9-4.04 1.9-6.37C29.1 8.69 25 4 19.95 4 14.9 4 10.8 8.69 10.8 14.45c0 2.33.67 4.55 1.9 6.37-4.23 2.91-7.13 8.1-7.84 14.12-.03.27.05.53.23.74.18.2.44.32.7.32h28.32c.27 0 .52-.11.7-.32.18-.2.26-.47.23-.74-.71-6.01-3.61-11.21-7.84-14.12zM19.95 5.88c4.01 0 7.28 3.84 7.28 8.57 0 2.26-.75 4.4-2.1 6.01-1.38 1.65-3.22 2.55-5.17 2.55-1.96 0-3.79-.91-5.17-2.55-1.36-1.62-2.1-3.75-2.1-6.01-.02-4.72 3.25-8.57 7.26-8.57zM6.88 34.12c.85-5.03 3.46-9.43 7.02-11.83 1.67 1.69 3.8 2.62 6.06 2.62s4.38-.92 6.05-2.62c3.56 2.4 6.17 6.8 7.02 11.83H6.88z"></path></svg>
                        <input class="e-form__input u-input--padding-left" type="text" name="_username" id="username" placeholder="Enter username" tabindex="1" autocomplete="off" value="">
                    </div>

                    <label for="password">Password</label>
                    <span class="u-form__help"><a href="https://hub.flashtalking.net/password-reset-request" title="Forgot Password">Forgot Password</a></span>
                    <div class="e-form__control e-form__control--password">
                        <label class="e-form__checkbox e-form__control--checkbox e-form__control--checkbox-right" for="checkbox">
                            <input name="checkbox" type="checkbox" id="checkbox" tabindex="3" autocomplete="off">
                            <span class="e-form__checkbox--bg"></span>
                            <span class="e-form__checkbox--label">Show Password</span>
                        </label>
                        <svg class="e-rhombicon e-rhombicon--padlock-locked e-form__control--icon e-form__control--icon-left u-icon-medium" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" enable-background="new 0 0 40 40"><path d="M30.72 16.41h-1.11v-2.62c0-5.4-4.39-9.79-9.79-9.79s-9.79 4.39-9.79 9.79v2.62H8.92c-1.02 0-1.85.83-1.85 1.85v15.89c0 1.02.83 1.85 1.85 1.85h21.8c1.02 0 1.85-.83 1.85-1.85V18.26c0-1.02-.83-1.85-1.85-1.85zm-18.84-2.62c0-4.38 3.56-7.94 7.94-7.94s7.94 3.56 7.94 7.94v2.62H11.88v-2.62zm18.84 20.36H8.92V18.26h21.8v15.89zm-12.94-4.87h4.08V27c.43-.49.67-1.13.67-1.78 0-1.5-1.22-2.71-2.71-2.71-1.5 0-2.71 1.22-2.71 2.71 0 .65.24 1.28.67 1.78v2.28zm2.04-5.39c.73 0 1.33.6 1.33 1.33 0 .37-.16.72-.44.98l-.23.21v1.48h-1.31v-1.48l-.23-.21a1.3 1.3 0 0 1-.44-.98 1.32 1.32 0 0 1 1.32-1.33z"></path></svg>
                                                                        <input class="e-form__input u-input--padding-left u-input--padding-right" type="password" name="_password" id="password" autocomplete="off" placeholder="Enter password" tabindex="2">
                        <input class="is-hidden" type="submit" id="click" form="login" name="_submit">
                    </div>
                </fieldset>
                 
            </form>
        </div>
        <div class="c-modal__footer">
            <div class="c-actions-bar">
                                <label for="click" class="c-button c-actions-bar__element" role="button" id="_submit" tabindex="5">Login</label>
            </div>
                                            </div>
    </div>
