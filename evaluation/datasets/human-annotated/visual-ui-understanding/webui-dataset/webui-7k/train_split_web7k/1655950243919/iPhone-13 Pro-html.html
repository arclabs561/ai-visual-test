<body>
    <script>
        var i18nResourcesUrl = "https://cdn.cloudappsecurity.com/i18n/0.228.22";
        var context = {"REDIRECT_URL":"https://www.worldbank.org/en/news/series/the-development-podcast","REDIRECT_DOMAIN":"www.worldbank.org","REDIRECT_SIMPLIFIED_URL":"https://www.worldbank.org/en/news/series/the-development-podcast","CONTEXTPATH":"https://mcasproxy.azureedge.net/proxyweb/1.16.25","TENANT_LOGO_PATH":""};
        var locale = "";
        var templateName = "cert-checker-redirect";
        var partials = [ "page-footer" ];
        var templatePath = "https://mcasproxy.azureedge.net/proxyweb/1.16.25/js/templates/" + templateName + ".hbs";

        Handlebars.registerHelper('json', function (content) {
            return JSON.stringify(content);
        });

        Handlebars.registerHelper('valOrDefault', function (value, defaultValue) {
            return value || defaultValue;
        });

        loadPartials();

        function onLoad(content){
            document.body.innerHTML += content;
            var evalOnLoad = document.getElementById("on-template-load");
            if (evalOnLoad) {
                eval(evalOnLoad.textContent);
            }
        }
        //polyfill intl
        if (!window.Intl) {
            //polyfill
            Translate.loadScript("https://mcasproxy.azureedge.net/proxyweb/1.16.25" + "/js/poly-intl/Intl.min.js", function() {
                // Load Handlebar-intl
                Translate.loadScript("https://mcasproxy.azureedge.net/proxyweb/1.16.25" + "/js/Handlebars/handlebars-intl-v1.1.2.min.js", function() {
                    Translate.initLocale("https://mcasproxy.azureedge.net/proxyweb/1.16.25", i18nResourcesUrl, locale, function () {
                        loadPartials().then(function(resolve, reject) {
                                Translate.loadContent(context,templatePath,onLoad)
                            }
                        );
                    });
                });
            });
        }
        else {
            Translate.loadScript("https://mcasproxy.azureedge.net/proxyweb/1.16.25" + "/js/Handlebars/handlebars-intl-v1.1.2.min.js", function() {
                Translate.initLocale("https://mcasproxy.azureedge.net/proxyweb/1.16.25", i18nResourcesUrl, locale, function () {
                    loadPartials().then(function(resolve, reject) {
                            Translate.loadContent(context,templatePath,onLoad)
                        }
                    );
                });
            });
        }

        function loadPartials() {
            var promises = [];
            if (typeof partials === "undefined" || partials.length === 0) {
                return SimplePromise.resolvedPromise();
            }
            partials.forEach(
                function (partial) {
                    promises.push(
                        new SimplePromise(function (resolve, reject) {
                                var templatePath = "https://mcasproxy.azureedge.net/proxyweb/1.16.25/js/templates/partials/" + partial + ".hbs";
                                var request = new XMLHttpRequest();
                                request.onload = function () {
                                    resolve(request);
                                };
                                request.open('GET', templatePath);
                                request.send();
                            }
                        ).then(function(partialRequest) {
                                Handlebars.registerPartial(partial, partialRequest.responseText)
                            }
                        )
                    );
                }
            );
            return SimplePromise.all(promises);
        }
    </script><script type="text/javascript" src="https://mcasproxy.azureedge.net/proxyweb/1.16.25/js/Handlebars/handlebars-intl-v1.1.2.min.js"></script>
