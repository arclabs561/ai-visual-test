		<style>
			@import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,300&display=swap');
			body {
				font-family: 'Lato', sans-serif;
			}
			.centered {
				text-align: center;
			}
			.groups {
				width: 90%;
				margin: auto;
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
			}
			.groups2 {
				width: 90%;
				margin: auto;
				display: flex;
				flex-wrap: wrap;
				justify-content: space-evenly;
			}
			.card, .set {
				margin: 12px;
				width: 200px;
			}
			.setname, .setdesc, footer, .title, .cardname {
				text-align: center;
			}
			.setname, .cardname {
				font-size: 18px;
				font-style: bold;
				border: 0 0 0 0;
				margin-bottom: 5px;
				margin-top: 8px;
			}
			.setdesc {
				font-style: italic;
				margin-top: 5px;
			}
			
			.card img, .set img {
				width: 200px;
			}

			.cardbig {
				border: 4px solid black;
				border-radius: 3%;
			}
			
			footer p {
				margin-bottom: 5px;
				margin-top: 8px;
			}
		</style>
		<script>
			var friendimg = ["https://ampersandia.net/bloodless/FriendCards/card_Allie.png", "https://ampersandia.net/bloodless/FriendCards/card_Bean.png", "https://ampersandia.net/bloodless/FriendCards/card_Jungledark.png", "https://ampersandia.net/bloodless/FriendCards/card_Lexi.png", "https://ampersandia.net/bloodless/FriendCards/card_Mechbees.png", "https://ampersandia.net/bloodless/FriendCards/card_TOMES.png", "jeby"]
			var jebyimg = ["https://ampersandia.net/bloodless/FriendCards/card_Jeby.png", "https://ampersandia.net/bloodless/FriendCards/card_Jemy.png", "https://ampersandia.net/bloodless/FriendCards/card_Jeny.png"]
			var jebynames = ["Jeny", "Jeby", "Jemy"]
			window.onload = function() {
				var img = document.getElementById("Friend Cards");
				if (img != null){
					var chosen = friendimg[Math.floor(Math.random()*friendimg.length)];
					if (chosen == "jeby"){
						chosen = jebyimg[Math.floor(Math.random()*jebyimg.length)];
					}
					img.src = chosen
					
				}
				
				img = document.getElementById("Jeny_img");
				if (img != null) {
					var rand = Math.floor(Math.random()*jebyimg.length)
					chosen = jebyimg[Math.floor(Math.random()*jebyimg.length)];
					img.src = chosen
					var nm = document.getElementById("Jeny_name");
					nm.innerText = jebynames[rand]
				}
				
				var txt = document.getElementById("download_friendcards");
				if (txt != null) {
					var hrefs = ["https://ampersandia.net/bloodless/friends.pdf", "https://ampersandia.net/bloodless/friends2.pdf", "https://ampersandia.net/bloodless/friends3.pdf"]
					txt.href = hrefs[Math.floor(Math.random()*hrefs.length)]
				}
			}
		</script>
		<script data-goatcounter="https://nikohascoolrocks.goatcounter.com/count" async="" src="//gc.zgo.at/count.js"></script>

</a>
