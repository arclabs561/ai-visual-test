<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0px" height="0px" position="absolute" top="0">
  <defs>

    <filter id="noise" x="0vw" y="0vh" width="100vw" height="100vh">
      <feFlood flood-color="#808080" result="neutral-gray"></feFlood>
      <feTurbulence in="neutral-gray" type="fractalNoise" baseFrequency="0.8" numOctaves="10" stitchTiles="stitch" result="noise"></feTurbulence>
      <feColorMatrix in="noise" type="saturate" values="0" result="destaturatedNoise"></feColorMatrix>
      <feComponentTransfer in="desaturatedNoise" result="theNoise">
        <feFuncA type="table" tableValues="0 0 0.2 0"></feFuncA>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="theNoise" mode="soft-light" result="noisy-image"></feBlend>
    </filter>


    <filter id="softGlow" height="300%" width="300%" x="-75%" y="-75%">
		    
		    <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="thicken"></feMorphology>

		    
		    <feGaussianBlur in="thicken" stdDeviation="10" result="blurred"></feGaussianBlur>

		    
		    <feFlood flood-color="rgba(254,65,123,0.8)" result="glowColor"></feFlood>

		    
		    <feComposite in="glowColor" in2="blurred" operator="in" result="softGlow_colored"></feComposite>

		    
		    <feMerge>
			      <feMergeNode in="softGlow_colored"></feMergeNode>
			      <feMergeNode in="SourceGraphic"></feMergeNode>
		    </feMerge>

	  </filter>

    <filter id="softGlowBlue" height="300%" width="300%" x="-75%" y="-75%">
		    
		    <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="thicken"></feMorphology>

		    
		    <feGaussianBlur in="thicken" stdDeviation="10" result="blurred"></feGaussianBlur>

		    
		    <feFlood flood-color="rgba(19,77,255,0.8)" result="glowColor"></feFlood>

		    
		    <feComposite in="glowColor" in2="blurred" operator="in" result="softGlow_colored"></feComposite>

		    
		    <feMerge>
			      <feMergeNode in="softGlow_colored"></feMergeNode>
			      <feMergeNode in="SourceGraphic"></feMergeNode>
		    </feMerge>

	  </filter>

  </defs>
