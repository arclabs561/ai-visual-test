var ocsHttpsForce = 0;
var timeout = 4000; //4秒
var groupSize = 3;

    http: [
	      "wssa-361.lldmotor8.com:1785",

	      "ocsapi1962.xuqtech.com",
	      "ocsapi1962.ambandage.com",

	    ],
  	path : '/ocs/zbw'
}
var ocsDict = {
  'jb00': 'zbjb',
  'dq00': 'zbaa',
  'ox00': 'zbaa',
  'uj08': 'zbaa',
  'kt11': 'zbaa',
}
var ocsPathExt = ocsDict;
var pageReload = false;
var ocsProtocol = location.protocol;
var commonProtocol = location.protocol; //cdn 和 api的
window.INIT_MASK = true;
window.IS_MOBILE = isMobileDevice;
window.TIME_OUT = timeout;
window.OCS_INFO = ocsInfo;

var OCS_EXE = {
    groupIndex: 0,
    ocsTimeout: timeout,
    done: false,
    hostInfoDone: false,
    ocsHandlerDone: false
};

function init() {
    swapOCSDomainFromCache();
    var ocsHost = location.protocol == 'http:' ? ocsInfo.http : ocsInfo.https;
    if(ocsHttpsForce == 1) {
        ocsProtocol = 'https:';
        ocsHost = ocsInfo.https; //強制使用https
    }
    var ocsGroup = grouping(ocsHost);
    OCS_EXE.domainGroup = ocsGroup;
    getOCSCache();
    groupPing(function(domain){
        getOCSConfig(domain);
    });
}

function getOCSCache() {
    var ocsCache = jsonFromCache('ocsInfo');
    if(ocsCache) ocsResultHandler(ocsCache);
}

function groupPing(callback) {
    var domainList = OCS_EXE.domainGroup[OCS_EXE.groupIndex];
    if(!domainList) { //所有組ocs失敗
        errorHandler('网速缓慢，重试请点击');
        return;
    }
    var errCount = 0,
        done = false;
    for (var i = 0; i < domainList.length; i++) {
        (function(){
            var domain = domainList[i];
            var url = ocsProtocol + '//' + domain + '/cc.png?v=' + Math.ceil(Math.random() * Math.pow(10, 10));
            window.nanoajax.ajax({
              url: url,
              method: 'get',
              timeout: OCS_EXE.ocsTimeout
            }, function(code) {
              if(code == 200) {
                if (done) return;
                done = true;
                callback(domain);
              } else {
                errCount++;
                if (errCount == domainList.length) {
                    console.error('all domian ping failed');
                    OCS_EXE.groupIndex++;
                    OCS_EXE.ocsTimeout = OCS_EXE.ocsTimeout * 2;
                    groupPing(callback);
                }
              }
            })
        })()
    }
}

function getOCSConfig(domain) {
    if(OCS_EXE.done) return;
    var snCache = getSNFromCache(),
        path = ocsPathExt[snCache] ? '/ocs/' + ocsPathExt[snCache] : ocsInfo.path;
    window.nanoajax.ajax({
        url: ocsProtocol + '//' + domain + path + '?ts=' + Date.now(),
        timeout: timeout
    }, function(code, res, req) {
        if (code == 200) {
            OCS_EXE.done = true;
            if(!OCS_EXE.ocsHandlerDone) ocsResultHandler(res);
            localStorage.setItem('ocsInfo', res);
            localStorage.setItem('ocs_fast_domain', domain);
        } else {
            OCS_EXE.groupIndex++;
            OCS_EXE.ocsTimeout = OCS_EXE.ocsTimeout * 2;
            groupPing(function(_domain) {
                getOCSConfig(_domain);
            });
        }
    })
}

function ocsResultHandler(res) {
    OCS_EXE.ocsHandlerDone = true;
    var respObj = JSON.parse(res);
    var protocolKey = location.protocol.replace(':','');
    var isHttpsForce = respObj.httpsForce == 1;
    if(isHttpsForce) {
        protocolKey = 'https';
        commonProtocol = 'https:';
    }
    var domainConfig = respObj[protocolKey];
    var versinConfig = respObj.versions;
    var versionKey = isMobileDevice ? 'zb_m' : 'zb_pc';
    var version = versinConfig[versionKey];
    window.CURRENT_VERSION = version;
    window.SKINS_VERSION = respObj.skin_versions;
    window.COMMON_PROTOCOL = commonProtocol;
    exportGlobal(respObj);
    window.INIT_DONE = true;
    setLocal(domainConfig.API_DOMAINS);
    setPublicDomain(respObj.public_domain);
    window.API_DOMIANS = randomArray(domainConfig.API_DOMAINS);
    var apiDomainsGroup = grouping(domainConfig.API_DOMAINS);
    window.API_DOMAINS_GROUP = apiDomainsGroup;
    cdnPing(domainConfig.CDN_PATHS, function(cdn) {
        var cdnPostfix = isMobileDevice ? '/m' : '/pc';
        window.UPLOAD_HOST = commonProtocol + '//' + cdn; //@配置-PRD
        window.CDN_PATH = commonProtocol + '//' + cdn + cdnPostfix;
        doHostInfo(0);
    })
}

function exportGlobal(Obj) {
    for(var p in Obj){
        if(p.substring(0,3) == 'gb_') {
            var key = p.substring(3).toUpperCase();
            window[key] = Obj[p];
        }
    }
}

function getSNFromCache() {
    var dataCache = jsonFromCache('hostInfo') || jsonFromCache('com_hostInfo');
    if(dataCache) {
        var info = JSON.parse(dataCache);
        return info.result.sn;
    }
}

function setPublicDomain(domains) {
    window.LOTTO_DOMAINS = domains;
}

function cdnPing(domainList, callback) {
    if (domainList.length == 1) {
        callback(domainList[0]);
        return;
    }
    var errCount = 0,
        done = false;
    for (var i = 0; i < domainList.length; i++) {
        (function(){
            var cdn = domainList[i];
            var url = commonProtocol + '//' + cdn + '/cc.png?v=' + Math.ceil(Math.random() * Math.pow(10, 10));
            window.nanoajax.ajax({
              url: url,
              method: 'get',
              timeout: timeout
            }, function(code) {
              if(code == 200) {
                if (done) return;
                done = true;
                callback(cdn);
              } else {
                errCount++;
                if (errCount == domainList.length) {
                    console.error('all CDN domian can not be used!');
                    errorHandler('加载网络资源失败, 重试请点击');
                }
              }
            })
        })()
    }
}

function doHostInfo(index) {
    var apiDomain = window.API_DOMIANS[index];
    if(!apiDomain) {
        errorHandler('页面加载失败，重试请点击');
        return;
    }
    var apiHost = commonProtocol + '//' + apiDomain;
    var currentDomian = window.DOMAIN_HARDCODE||queryString('domain')||document.domain;
    var ran = new Date().getTime() + '_' + Math.random();
    var param = {
        pv: 'ajax',
        pa: 'host.info',
        domain: currentDomian,
        terminal: isMobileDevice ? 8 : 1
    }
    var apiUrl = apiHost + '/zb-cloud/stat.do?' + Tools.stringify(param);
    var dataCache = jsonFromCache('hostInfo') || jsonFromCache('com_hostInfo');
    if (dataCache) {
        window.API_HOST = apiHost;
        hostInfoResultHandler(JSON.parse(wrapper(dataCache)));
    }
    window.nanoajax.ajax({
        url: apiUrl,
        method: 'get',
        timeout: timeout * Math.pow(2, index)
    }, function(code, res, req) {
        if (code == 200) {
            var resObj = JSON.parse(wrapper(res));
            localStorage.setItem('hostInfo', JSON.stringify(resObj))
            if (!dataCache) {
                window.API_HOST = apiHost;
                hostInfoResultHandler(resObj);
            }
        } else {
            doHostInfo(++index);
        }
    });
}

function wrapper(jsonStr) {
    var obj = JSON.parse(jsonStr);
    return JSON.stringify(obj.hasOwnProperty('result') ? obj : {result : obj});
}

function httpsUrlHandler(url) {
    let pattern = /^(http:)\/\/(.+):(\d+)(.*)+/
    let result = pattern.exec(url)
    if (!result) return /^https/.test(url) ? url : 'https' + url.substring(4);
    let port = Number(result[3]) + 1
    return url.replace(pattern, 'https://$2:' + port + '$4')
}

function hostInfoResultHandler(obj) {
    if (!obj.result || OCS_EXE.hostInfoDone) return;
    OCS_EXE.hostInfoDone = true;
    if(!obj.result.webPath) {
        errorHandler('网络页面不存在，请联系客服<br>' + document.domain, 120);
        return;
    }
    var skin = obj.result.webPath;
    var sn = obj.result.sn;
    var isMaintain = obj.result.isMaintain; //是否全站維護
    var isBlock = obj.result.isBlock; //IP限制
    var currentVersion = isMobileDevice ? window.CURRENT_VERSION : window.SKINS_VERSION[skin]||window.CURRENT_VERSION;
    var isHttps = obj.result.httpsSupport == 1;
    if(isHttps && location.protocol == 'http:') {
        location.href = httpsUrlHandler(location.href)
        return;
    }
    window.SKIN = skin;
    window.SN = sn;
    window.FIRST_PAGE_FLAG = obj.result.firstPageFlag;
    document.cookie = "p_skin=" + escape(skin) + ";path=/";
    document.cookie = "skin=" + escape(skin) + ";path=/";
    document.cookie = "p_sn=" + escape(sn) + ";path=/";
    document.cookie = "sn=" + escape(sn) + ";path=/";
    if (isBlock == 1) {
        ipReject(obj.result.fromIp, obj.result.location);
        return;
    }

    var appCss = document.createElement('link')
    appCss.href = CDN_PATH + '/' + currentVersion + '/static/css/' + skin + '.css';
    appCss.setAttribute('rel', 'stylesheet');
    appCss.onload = function(){window.CSS_LOADED = true;};
    document.head.appendChild(appCss);

    var jsList = ['pc/lib/jquery.min-1.9.1', 'manifest', 'vendor', 'common', skin];
    if(!isMobileDevice) jsList.unshift('pc/public/vendor.dll');
    for (var i = 0; i < jsList.length; i++) {
        var name = jsList[i];
        var js = document.createElement('script')
        js.async = false;
        if (name.substr(0, 3) == 'pc/') {
            js.src = UPLOAD_HOST + '/' + name + '.js'; //@配置-PRD
        } else {
            js.src = CDN_PATH + '/' + currentVersion + '/static/js/' + name + '.js';
        }
        document.body.appendChild(js)
    }
}

function swapOCSDomainFromCache() {
    var _http = jsonFromCache('com_configsHttp', true), _https = jsonFromCache('com_configsHttps', true);
    if(_http) ocsInfo.http = _http;
    if(_https) ocsInfo.https = _https;
}

function jsonFromCache(key, toObject) {
    var value = localStorage.getItem(key), obj;
    try {
        obj = JSON.parse(value);
    } catch(e) {
        value = undefined;
        localStorage.removeItem(key);
    };
    return toObject ? obj : value;
}

function grouping(arr) {
    var result = [];
    var groupCount = Math.ceil(arr.length/groupSize);
    for(var g=1; g<=groupCount; g++){
        var group = [];
        for(var i=1; i<=groupSize; i++){
            var index = g==1 ? i-1 : (g-1)*groupSize + i -1 ;
            if(arr[index]) group.push(arr[index]);
        }
        result.push(group)
    }
    return result;
}

function setLocal(arr) {
    for (var i = 0; i < arr.length; i++) {
        var host = arr[i];
        if(host == '.') {
            var port = location.port;
            arr[i] = document.domain + (port ? ':' + port : '');
        }
    }
}

function setCanvas(element,conf) {
    if(!conf) return
    var canvas = document.getElementById(element)
    var context = canvas.getContext('2d')
    var image = new Image();
    image.onload = function() {
        canvas.width = conf.imageWidth
        canvas.height = conf.imageHeight
        context.drawImage(image, 0, 0, canvas.width ,canvas.height);
        for(var i=0; i < conf.fontConfig.length; i++){
            var obj = conf.fontConfig[i];
            context.font = (obj.fz ? obj.fz : "16px Verdana")
            context.textAlign = (obj.textAlign ? obj.textAlign : 'left')
            context.fillStyle = (obj.color ? obj.color : '#000')
            obj.prefix = (obj.prefix ? obj.prefix : '')
            obj.suffix = (obj.suffix ? obj.suffix : '')
            context.fillText( obj.prefix + obj.text + obj.suffix, obj.x, obj.y);
        }
    }
    image.src = conf.src;
}

function errorHandler(msg, seconds) {
    if(pageReload) return;
    pageReload = true;
    seconds = seconds||5;
    document.body.innerHTML = '<div id="error-main" onclick="location.reload(true)"><div class="tips-top">连接超时，稍后自动为您重试</div><div class="middle"><div class="tips-img"></div><div id="tips-text">' + msg + '<span class="err-count">(<span id="countdown">' + (seconds+1) + '</span>)</sapn></div></div></div>';
    countdown();
}

function countdown() {
    localStorage.removeItem('hostInfo');
    localStorage.removeItem('ocsInfo');
    var ele = document.getElementById('countdown');
    var seconds = ele.innerText;
    if(seconds == 0) {
        location.reload(true);
    } else {
        ele.innerText = seconds - 1;
        setTimeout(countdown, 1000);
    }
}

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomArray(arr) {
    var getRanNum = function(len) {
        var r = [];
        while (true) {
            var num = Math.ceil(Math.random() * len) - 1;
            if (r.indexOf(num) == -1) r.push(num);
            if (r.length >= len) break;
        }
        return r;
    };
    var result = [];
    if (arr.length <= 3) {
        var ranNums = getRanNum(arr.length);
        for (var i = 0; i < ranNums.length; i++) {
            var index = ranNums[i];
            result.push(arr[index]);
        }
    } else {
        var pre = arr.slice(0, 3),
            post = arr.slice(3);
        var ranNums = getRanNum(pre.length);
        for (var i = 0; i < ranNums.length; i++) {
            var index = ranNums[i];
            result.push(pre[index]);
        }
        result = result.concat(post);
    }
    return result;
}

function completed() {
    window.removeEventListener("load", completed)
    init();
}

function queryString(key) {
    var location = document.location.search;
    return (location.match(new RegExp("(?:^\\?|&)" + key + "=(.*?)(?=&|$)")) || ['', null])[1];
}

window.addEventListener("load", completed, false)
})();
