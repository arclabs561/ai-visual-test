    <div class="container"><div class="overlay-panel"><fieldset class="preferences">
          <form method="post" action="/saveprefs" autocomplete="off">
            <input name="referer" value="/midlajme" style="display: none; ">
            <div>
              <legend>Display</legend>
              <div class="pref-group pref-input">
                <label for="theme">Theme</label>
                <select name="theme">
                  <option value="Auto">Auto</option>
                  <option value="Auto (Twitter)">Auto (Twitter)</option>
                  <option value="Black">Black</option>
                  <option value="Dracula">Dracula</option>
                  <option value="Mastodon">Mastodon</option>
                  <option value="Nitter" selected="">Nitter</option>
                  <option value="Pleroma">Pleroma</option>
                  <option value="Twitter">Twitter</option>
                  <option value="Twitter Dark">Twitter Dark</option>
                </select>
              </div>
              <label class="pref-group checkbox-container">Infinite scrolling (experimental, requires JavaScript)<input name="infiniteScroll" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Make profile sidebar stick to top<input name="stickyProfile" type="checkbox" checked=""><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Support bidirectional text (makes clicking on tweets harder)<input name="bidiSupport" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Hide tweet stats (replies, retweets, likes)<input name="hideTweetStats" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Hide profile banner<input name="hideBanner" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Hide pinned tweets<input name="hidePins" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Hide tweet replies<input name="hideReplies" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Square profile pictures<input name="squareAvatars" type="checkbox"><span class="checkbox"></span></label>
              <legend>Media</legend>
              <label class="pref-group checkbox-container">Enable mp4 video playback (only for gifs)<input name="mp4Playback" type="checkbox" checked=""><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Enable hls video streaming (requires JavaScript)<input name="hlsPlayback" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Proxy video streaming through the server (might be slow)<input name="proxyVideos" type="checkbox" checked=""><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Mute videos by default<input name="muteVideos" type="checkbox"><span class="checkbox"></span></label>
              <label class="pref-group checkbox-container">Autoplay gifs<input name="autoplayGifs" type="checkbox" checked=""><span class="checkbox"></span></label>
              <legend>Link replacements (blank to disable)</legend>
              <div class="pref-group pref-input ">
                <label for="replaceTwitter">Twitter -&gt; Nitter</label>
                <input name="replaceTwitter" type="text" placeholder="Nitter hostname" value="nitter.net">
              </div>
              <div class="pref-group pref-input ">
                <label for="replaceYouTube">YouTube -&gt; Piped/Invidious</label>
                <input name="replaceYouTube" type="text" placeholder="Piped hostname" value="piped.kavin.rocks">
              </div>
              <div class="pref-group pref-input ">
                <label for="replaceReddit">Reddit -&gt; Teddit/Libreddit</label>
                <input name="replaceReddit" type="text" placeholder="Teddit hostname" value="teddit.net">
              </div>
              <div class="pref-group pref-input ">
                <label for="replaceInstagram">Instagram -&gt; Bibliogram</label>
                <input name="replaceInstagram" type="text" placeholder="Bibliogram hostname" value="" autofocus="">
              </div>
            </div>
            <h4 class="note">Preferences are stored client-side using cookies without any personal information.</h4>
            <button class="pref-submit" type="submit">Save preferences</button>
          </form>
          <form class="pref-reset" method="post" action="/resetprefs">
            <input name="referer" value="/midlajme" style="display: none; ">
            <button type="submit">Reset preferences</button>
          </form>
        </fieldset></div></div>
