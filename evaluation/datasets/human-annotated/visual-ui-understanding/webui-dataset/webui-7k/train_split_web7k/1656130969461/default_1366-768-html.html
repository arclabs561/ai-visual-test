					var sizeIframe = function(event){
						var origin = event.origin || event.originalEvent.origin; // For Chrome, the origin property is in the event.originalEvent object.
  						if (origin != 'null' ){
  							if (origin !== 'https://shareasale.com' )
  								return;
  						} 
  						
  						//check for scoll option
  						try {
	  						if (event.data.scrollToBottom){
	  							window.scrollTo(0,document.body.scrollHeight);	
	  							return;
	  						}  	
	  					}catch (err){}					 							
  							  							
						frm = document.getElementById('bio_recruit');				
						var frmWidth = 1000;
						var frmHeight = 1000;
						try {
							if (!isNaN(parseInt(event.data.w)))
								frmWidth = parseInt(event.data.w);
							if (!isNaN(parseInt(event.data.h)))
								frmHeight = parseInt(event.data.h);
						}catch (err){}

						frm.style.height = frmHeight + 4 + "px";	
						frm.style.width = frmWidth + 4 + "px";
						frm.style.visibility = 'visible';				
						
						
						
						
																	
					}//sizeIframe
					
					function hideRedX(inputName){
						if(inputName)
							inputName.className = '';
				     	return;
				     }
					
					function showRedX(inputName){
						if(inputName)
							inputName.className = 'err';
				     	return;
				     }
				     
				     function comparePassword(){
				     	var pword = document.getElementById('newPassword');
				     	var cword = document.getElementById('confirm');
				    	if(!pword || !cword)
				    		return true;
				    	else if(pword.value != cword.value){
				    		showRedX(cword);
				     	} else if(pword.value == cword.value)
			     			hideRedX(cword);
				     	return;
				     }//comparePassword
				     
				     function checkLen(el){				     	
				     	if( (el.type == 'text' || el.type == 'password') && el.value.length)
				     		hideRedX(el);
				     	else if (el.type == 'select-one' && el.options[el.selectedIndex].value.length)
				     		hideRedX(el);
				     }//checkLen
				     
				     function checkform(frm){
				     	var fail = false;
				     	if (!frm['username'] || !frm['username'].value.length){
				     		showRedX(frm['username']);				     		
				     		fail = true;
				     	} else if (frm['username']  && !validateUsername(frm['username'].value)){			
				     		var inst = document.getElementById('userIdValidateMsg');
				     		inst.style.display = 'block';
				     		inst.innerHTML = 'Usernames may consist of the following characters only: a-z, A-Z, 0-9, -, _, @, .';
				     		showRedX(frm['username']);	
				     		fail = true;	
				     	}
				     					     	
						if (!frm['passwrd'] || !frm['passwrd'].value.length){
				     		showRedX(frm['passwrd']);				     		
				     		fail = true;
				     	}   	
				     	if (!frm['confirm'] || !frm['confirm'].value.length){
				     		showRedX(frm['confirm']);				     		
				     		fail = true;
				     	}
				     	
				     	var country  = frm['country'];	
				     	if (!country || !country.options[country.selectedIndex].value.length){
				     		showRedX(frm['country']);				     		
				     		fail = true;
				     	}
				     	
				     	var pword = document.getElementById('newPassword');
				     	var cword = document.getElementById('confirm');
				     	if(pword.value != cword.value){
				    		showRedX(cword);
				    		fail = true;
				    	}			    	
				    		
				     	return !fail;
				     }
				     
				     function checkformLogin(frm){
				     	var fail = false;
				     	if (!frm['username'] || !frm['username'].value.length){
				     		showRedX(frm['username']);				     		
				     		fail = true;
				     	}
						if (!frm['password'] || !frm['password'].value.length){
				     		showRedX(frm['password']);				     		
				     		fail = true;
				     	}   					     	
				     	return !fail;
				     }
				     
				     function checkformInvite(frm){
				     	var fail = false;
				     	if (!frm['invitationcode'] || !frm['invitationcode'].value.length){
				     		showRedX(frm['invitationcode']);				     		
				     		fail = true;
				     	}  					     	
				     	return !fail;
				     }
				     
				     function validateUsername(uName){
				     	var re = /^[\w@\.-]*$/;				     	
				     	return re.test(uName);
				     
				     }//validateUsername
