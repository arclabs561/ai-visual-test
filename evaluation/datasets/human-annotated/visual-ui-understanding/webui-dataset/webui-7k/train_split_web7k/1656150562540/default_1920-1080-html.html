<script>
	var baseUrl = '//devlogic.com';


var PIXEL_RATIO = (function () {
  var ctx = document.createElement('canvas').getContext('2d'),
    dpr = window.devicePixelRatio || 1,
    bsr = ctx.webkitBackingStorePixelRatio ||
          ctx.mozBackingStorePixelRatio ||
          ctx.msBackingStorePixelRatio ||
          ctx.oBackingStorePixelRatio ||
          ctx.backingStorePixelRatio || 1;
    return dpr / bsr;
})();

createHiDPICanvas = function(w, h, ratio) {
  if (!ratio) { ratio = PIXEL_RATIO; }
  var can = document.createElement('canvas');
  can.width = w * ratio;
  can.height = h * ratio;
  can.style.width = w + 'px';
  can.style.height = h + 'px';
  can.getContext('2d').setTransform(ratio, 0, 0, ratio, 0, 0);
  return can;
}

function goto(url) {
  window.location = url;
}

$( document ).ready(function(){
  var color = [
  {bgcolor:'#598A32',color:'#FFFFFF'},
  {bgcolor:'#4C433E',color:'#E1DCCB'}, 
  {bgcolor:'#FFFFFF',color:'#ED1C24'},
  {bgcolor:'#650965',color:'#fbe3fb'},
  {bgcolor:'#F4F0E4',color:'#2B0E06'},
  {bgcolor:'#18364B',color:'#FFFFFF'},
  {bgcolor:'#00B1C1',color:'#FFFFFF'},
  {bgcolor:'#D2D2D2',color:'#231F20'}];
	
  var fonts = ['ubuntu_bold'];
  var sliderSettings = {"mode":"horizontal","auto":true,"speed":6000,"pause":2000,"infiniteLoop":true,"autoHover":true,"minSlides":1,"maxSlides":4,"moveSlides":1,"slideWidth":250,"slideMargin":5,"randomStart":false,"pager":false,"controls":false,"prevText":"<i class=\"fa fa-angle-left\"><\/i>","nextText":"<i class=\"fa fa-angle-right\"><\/i>"};
  var ms = Math.floor(($(window).width()-30) /250);
  
  $('.logo-canvas').each(function(index){
    var link = $(this).attr('data-link');
    var logoText = $(this).attr('data-txt');
    var sId = $(this).attr('data-id');
    var canvas = createHiDPICanvas( 250 , 100 , 1 );
    $(this).append( canvas );
    var ind = sId % color.length;
    var theme = color[ind];
    var ind2 = sId % fonts.length;
    var myfont = fonts[ind2];
    
    canvas.addEventListener('click', function(){goto(link)}, false);
    
    var stage = new createjs.Stage(canvas);
    var shape = new createjs.Shape();
    
    if (theme.bgimage !== undefined) {
      console.log(theme.bgimage);
      var image = new Image();
      image.src = theme.bgimage;
      image.onload = function() {
        shape.graphics.beginBitmapFill(image).drawRect( 10 , 10 , 230 , 80 ).endFill();
      }
    } else {
      shape.graphics.beginFill(theme.bgcolor).drawRect( 10 , 10 , 230 , 80 ).endFill();
    }
    
    stage.addChild( shape );
    
    var txtLogo = new txt.Text({
        root : baseUrl+'/assets/js/vendor/txtjs',
        text: logoText,
        font: myfont,
        lineHeight:28,
        width:230,
        height:36,
        strokeColor:null,
        fillColor:theme.color,
        align:4,
        style:[],
        size:28,
        x:10,
        y:28,
    });
    
    txtLogo.shadow = new createjs.Shadow('rgba(0,0,0,0.6)', 1, 1, 10);      
    stage.addChild(txtLogo);    
    stage.update();
  });
});
</script>
