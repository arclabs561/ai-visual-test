    <script>
        const blocks_el = document.querySelector('#blocks');

        
        // var days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        // var d = new Date();
        // var dayName = days[d.getDay()];

        // console.log(dayName);

        fetch(`https://collectionapi.metmuseum.org/public/collection/v1/search?q=everyday`)
        .then(res => res.json())
        .then((data) => {

            console.log(data.objectIDs);
            
            data.objectIDs.forEach((artwork) => {

                fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/` + artwork)
                .then(res => res.json())
                .then((data) => {

                    let overall_dim = [];

                    if (data.measurements != undefined) {
                        for (dim of data.measurements) {
                            if (dim.elementName == 'Overall') {
                                overall_dim.push(dim); 
                                console.log
                            }
                        }
                    }

                    console.log(overall_dim);

                    if (overall_dim.length > 0) {
                        let block_el = document.createElement('div');
                        block_el.classList.add('block');

                        block_el.style.height = overall_dim[0].elementMeasurements.Height + 'px';
                        block_el.style.width = overall_dim[0].elementMeasurements.Width + 'px';

                        blocks_el.prepend(block_el);
                    }

                });
            });
        });
    </script>
