<script>
var base_url = 'https://www.hillpet.net/account/';
var module_id = "home";
var disclaimers = "";
var account_number = "";
var customer_name = "";
var user_email = "";
var visible_accounts = 25;
var credit_request_enabled = false;
var credit_request_department = 0;
var credit_request_message = "";
var credit_request_disclaimer = "";
var payments_enabled = false;
var payment_settings = [];

$(document).ready(function(){
	$('.hidden').removeClass('hidden').hide();
	$('.disabled').prop('disabled',true);
	$('select.form-control').css({'width':'100%'});
	$('.date-picker').datepicker({autoclose:true,todayHighlight:true});
	$('.datetime-picker').datetimepicker({autoclose:true,todayHighlight:true});
	$('[data-toggle="popover"]').popover();
	$('[data-toggle="tooltip"]').tooltip();
	$('#feedback-messages .logout').delay(10000).slideUp('slow');
	//$('#feedback-messages .debug').delay(10000).slideUp('slow');
	
	$('#searchMessage .panel-body, #search_message .panel-body').prepend('<span class="pull-right fas fa-edit text-primary" title="Click to Edit"></span>');
	
	// LAZY LOAD IMAGES
	[].forEach.call(document.querySelectorAll('img[data-src]'), function(img) {
		img.setAttribute('src', img.getAttribute('data-src'));
		img.onload = function() {
			img.removeAttribute('data-src');
		};
	});
	
	// SEARCH FIELDS
	$(document).on('focus', '.select2, .autocomplete, .type-ahead, .date-picker, .datetime-picker, .date-picker input', function(){
		$(this).attr('type','search').attr('autocomplete','off');
	});
	
	// AUTOSIZE TEXTAREA
	$(document).on('focus', 'textarea', function(){
		autosize($(this));
	});
	
	// NOTIFY JS DEFAULTS
	$.notifyDefaults({
		type:'danger',
		delay:10000,
		mouse_over:'pause',
		placement:{
			from:'bottom',
			align:'right'
		},
		url_target: '_self'
	});
	
	// DataTables - Defaults
	$.fn.dataTable.ext.errMode = function ( settings, helpPage, message ) { 
		console.log(message);
	};
	$.extend(true, $.fn.dataTable.defaults, {
		//'dom': '<"row"<"col-sm-6"l><"col-sm-6"f>><"table-responsive"tr><"row"<"col-sm-5"i><"col-sm-7"p>>',
		'order': [],
		'fixedHeader': {
			//headerOffset: $('#admin-navbar').outerHeight(),
            header: true,
            footer: true
		},
		'processing': true,
		'pageLength': 25,
		'autoWidth': false,
		'lengthChange': true,
		'lengthMenu': [
			[10, 25, 50, 100, -1], 
			[10, 25, 50, 100, 'All']
		],
		'language': {
			'emptyTable': 'No results were found. Please try again.',
			'loadingRecords': 'Loading. Please wait...',
			'processing': 'Loading. Please wait...',
			'lengthMenu': '_MENU_',
			'info': '_START_ to _END_ of _TOTAL_ records',
			'search': '',
			'searchPlaceholder': 'Quick Filter',
			'paginate': {
				'previous': '<i class="far fa-chevron-left"></i>',
				'next': '<i class="far fa-chevron-right"></i>',
				'first': '<i class="far fa-chevron-double-left"></i>',
				'last': '<i class="far fa-chevron-double-right"></i>',
			}
		},
	});
	
	// SELECT2 DEFAULTS
	$.fn.select2.defaults.set('theme', 'bootstrap');
	$.fn.select2.defaults.set('allowClear', true);
	
	// CHARTJS
	Chart.defaults.global.responsive = true;
	Chart.defaults.global.animation.animateScale = true;
	Chart.defaults.global.animation.animateRotate = true;
	Chart.defaults.global.cutoutPercentage = 40;
	Chart.defaults.global.legend.labels.boxWidth = 15;
	
	Chart.pluginService.register({
		beforeDraw: function (chart) {
			if (chart.config.options.elements.center) {
				//Get ctx from string
				var ctx = chart.chart.ctx;
				
				//Get options from the center object in options
				var centerConfig = chart.config.options.elements.center;
				var fontStyle = centerConfig.fontStyle || 'Arial';
				var txt = centerConfig.text;
				var color = centerConfig.color || '#000';
				var sidePadding = centerConfig.sidePadding || 20;
				var sidePaddingCalculated = (sidePadding/100) * (chart.innerRadius * 2)
				//Start with a base font of 30px
				ctx.font = "30px " + fontStyle;
				
				//Get the width of the string and also the width of the element minus 10 to give it 5px side padding
				var stringWidth = ctx.measureText(txt).width;
				var elementWidth = (chart.innerRadius * 2) - sidePaddingCalculated;
				
				// Find out how much the font can grow in width.
				var widthRatio = elementWidth / stringWidth;
				var newFontSize = Math.floor(30 * widthRatio);
				var elementHeight = (chart.innerRadius * 2);
				
				// Pick a new font size so it will not be larger than the height of label.
				var fontSizeToUse = Math.min(newFontSize, elementHeight);
				
				//Set font settings to draw it correctly.
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				var centerX = ((chart.chartArea.left + chart.chartArea.right) / 2);
				var centerY = ((chart.chartArea.top + chart.chartArea.bottom) / 2);
				ctx.font = fontSizeToUse+"px " + fontStyle;
				ctx.fillStyle = color;
				
				//Draw text in center
				ctx.fillText(txt, centerX, centerY);
			}
		}
	});
	
	// KEYBOARD SHORTCUTS
	$(document).on('keydown', function(e) {
		if (!e.ctrlKey){ return true; }
		if ((e.which == 71) && ($('.dataTables_filter input').length)) { // g - find
			e.preventDefault();
			$('.dataTables_filter input').focus();
		} else if ((e.which == 83) && ($('#searchModal').length)){ // s - search
			e.preventDefault();
			$('#searchModal').modal({'backdrop':'static','show':true});
		}
	});
	
	// VERIFY EMAIL
	$(document).on('change', 'input.verify-email', function(){
		var self = $(this);
		var email = self.val();
		var cont = self.closest('.form-group');
		cont.removeClass('has-error has-success');
		if(email){
			$.getJSON(base_url+'api/email/verify?email='+email, function(data){
				if(data.status === false){
					cont.addClass('has-error');
				} else {
					cont.addClass('has-success');
				}
			});
		} else {
			cont.addClass('has-error');
		}
		return true;
	});
	
	$(document).on('blur', ':input.mailcheck', function(e){
		var self = $(this);
		var help = self.closest('.form-group').find('.help-block');
		
		self.mailcheck({
			topLevelDomains: ['com', 'net', 'org', 'edu', 'gov'],
			suggested: function(element, suggestion) {
				help.html('Did you mean <a class="mailcheck-suggestion">' + suggestion.full + '</a>?');
				$(document).on('click', '.mailcheck-suggestion', function(e){
					self.val(suggestion.full).trigger('change');
					help.html('');
				});
			},
			empty: function(element) {
				help.html('');
			}
		});
	});
	

	
	$('#form-contact').validate({
		rules: {
			first_name: 'required',
			last_name: 'required',
			account_number: 'required',
			category_id: 'required',
			customer_phone: {
				required: true,
				digits: true,
				minlength: 10
			},
			customer_email: {
				required: true,
				email: true
			},
			customer_comments: 'required'
		},
		messages: {
			first_name: 'Please enter your first name.',
			last_name: 'Please enter your last name.',
			customer_phone: {
				required: 'Please enter a valid phone number.',
				minlength: 'Your phone number must consist of at least 10 digits.'
			},
			customer_email: {
				required: 'Please provide a valid email address.'
			},
			customer_comments: 'Please provide any relevant information to help with this request.'
		},
		errorElement: 'em',
		errorPlacement: function(error,element) {
			error.addClass('help-block');
			element.parents('.form-group').addClass('has-feedback');
			
			if (element.prop('type') === 'checkbox'){
				error.insertAfter(element.parent('label'));
			} else {
				error.insertAfter(element);
			}
		},
		highlight: function(element,errorClass,validClass){
			$(element).parents('.form-group').addClass('has-error').removeClass('has-success');
		},
		unhighlight: function(element,errorClass,validClass){
			$(element).parents('.form-group').addClass('has-success').removeClass('has-error');
		},
		submitHandler: function(form,event){
			event.preventDefault();
			$(form).parents('.modal').modal('hide');
			
			var form_data = $(form).serialize();
			var request = $.ajax({
				url: '/api/comments',
				data: form_data,
				method: 'POST',
				cache: false,
				dataType: 'json'
			});
			request.done(function(obj){
				var alert_class = (obj.status) ? "alert-success" : "alert-danger";
				$('#feedback-messages').html('<div class="alert '+alert_class+'">'+obj.response+'</div>');
				if (obj.status){
					$(form).trigger('reset');
				}
			});
			request.fail(function(jqXHR, textStatus){
				$('#feedback-messages').html('<div class="alert alert-danger">An error has occurred while processing this request.</div>');
			});
			request.always(function(){
				window.scrollTo(0, 0);
			});
		}
	});
});
</script>

		window.location.href = base_url+'auth/'+provider;

		var dialog = bootbox.prompt({
			title: "Reset Password",
			placeholder: 'Email Address',
			required: true,
			buttons: {
				cancel: {
					className: 'btn-default',
					label: 'Cancel'
				},
				confirm: {
					className: 'btn-danger',
					label: 'Reset'
				}
			},
			onShow: function(e) {
				$(e.target).find('.bootbox-form').append('<p class="help-block">Forgot your password? Enter your registered email address to reset your password.</p>');
			},
			callback: function (result) {
				if(result){
					var request = $.ajax({
						url: '/api/resetPassword',
						data: {
							user_name: result
						},
						method: 'POST',
						dataType: 'json'
					});
					request.done(function(obj){
						var alert_class = (obj.status) ? "alert-success" : "alert-danger";
						$('#feedback-messages').html('<div class="alert '+alert_class+'">'+obj.response+'</div>');
					});
					request.fail(function(jqXHR, textStatus){
						$('#feedback-messages').html('<div class="alert alert-danger">An error has occurred while processing this request.</div>');
					});
				}
			}
		});
	});
	$('#form-login').validate({
		rules: {
			user_name: {
				required: true,
				minlength: 4
			},
			user_password: {
				required: true,
				minlength: 6
			}
		},
		messages: {
			user_name: 'Please enter your username or email address.',
			user_password: 'Please enter a valid password.'
		},
		errorElement: 'em',
		errorPlacement: function(error,element) {
			error.addClass('help-block');
			element.parents('.form-group').addClass('has-feedback');
			
			if (element.prop('type') === 'checkbox'){
				error.insertAfter(element.parent('label'));
			} else {
				error.insertAfter(element.parent('.input-group'));
			}
		},
		highlight: function(element,errorClass,validClass){
			$(element).parents('.form-group').addClass('has-error').removeClass('has-success');
		},
		unhighlight: function(element,errorClass,validClass){
			$(element).parents('.form-group').addClass('has-success').removeClass('has-error');
		}
	});
	$(document).on('click', '.request-access:not(.disabled)', function(){
		var self = $(this);
		var department = self.data('department');
		
		var dialog = bootbox.dialog({
			title: 'Request Access',
			message: '<p class="lead text-center"><i class="fas fa-spin fa-spinner"></i> Loading...</p>',
			buttons: {
				cancel: {
					label: "Cancel",
					className: 'btn-danger'
				},
				ok: {
					label: "Send Request",
					className: 'btn-primary',
					callback: function(){
						var form = dialog.find('form');
						form.validate({
							rules: {
								first_name: 'required',
								last_name: 'required',
								customer_number: 'required',
								customer_name: 'required',
								category_id: 'required',
								customer_phone: {
									required: true,
									digits: true,
									minlength: 10
								},
								customer_email: {
									required: true,
									email: true
								},
								customer_comments: 'required'
							},
							messages: {
								first_name: 'Please enter your first name.',
								last_name: 'Please enter your last name.',
								customer_number:'Please enter account number.',
								customer_name:'Please enter account name.',
								customer_phone: {
									required: 'Please enter a valid phone number.',
									minlength: 'Your phone number must consist of at least 10 digits.'
								},
								customer_email: {
									required: 'Please enter a valid email address.'
								},
								customer_comments: 'Please provide any relevant information to help with this request.'
							},
							errorElement: 'em',
							errorPlacement: function(error,element) {
								error.addClass('help-block');
								element.parents('.form-group').addClass('has-feedback');
								error.insertAfter(element);
								
								return false;
							},
							highlight: function(element,errorClass,validClass){
								$(element).parents('.form-group').addClass('has-error').removeClass('has-success');
							},
							unhighlight: function(element,errorClass,validClass){
								$(element).parents('.form-group').addClass('has-success').removeClass('has-error');
							}
						});
						
						if(form.valid()){
							dialog.find('.bootbox-accept').prop('disabled',true).addClass('disabled');
							
							var request = $.ajax({
								url: '/api/ticket',
								data: form.serialize(),
								method: 'POST',
								dataType: 'json'
							});
							request.done(function(data){
								var n_status = data.hasOwnProperty('status') ? data.status : false;
								var n_response = data.hasOwnProperty('response') ? data.response : 'An unknown error was encountered processing request.';
								var n_class = (n_status==true) ? 'success' : 'danger';
								var n_options = {message:n_response};
								var n_settings = {type:n_class};
								$.notify(n_options,n_settings);
							});
