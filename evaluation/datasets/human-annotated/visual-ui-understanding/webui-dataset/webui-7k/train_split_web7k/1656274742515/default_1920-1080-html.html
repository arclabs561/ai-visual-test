<!DOCTYPE html><html><head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>ICQ mail</title>

    <link rel="stylesheet" type="text/css" href="/mainl.css?140812" media="screen">
</head>

<body class="body">

<div class="l-header">
    <div class="l-wrapper">
        <a class="menu_list_link logo" href="http://www.icq.com">
            <img class="logo_img" src="/img/logo.jpg" alt="www.icq.com">
        </a>
    </div>
</div>

<div class="l-content">
    <div class="content_outer">
        <div class="content_middle">
            <div class="content_inner">

                <h1 class="title">
                    Access to ICQ mail
                </h1>
                <form class="login_form" method="post" action="//auth.mail.ru/cgi-bin/auth?lang=en_US">
                    <div class="login_row">
                        <label class="login_label">
                                <span class="login_label_text">
                                    Account
                                </span>
                            <input class="login_input" type="text" name="Login" value="" autofocus="autofocus">
                            <span class="login_label_desc">@icqmail.com</span>
                        </label>
                    </div>
                    <div class="login_row">
                        <label class="login_label">
                                <span class="login_label_text">
                                    Password
                                </span>
                            <input class="login_input" type="password" name="Password" value="" autocomplete="off">
                        </label>
                    </div>

                    <input class="login_submit_btn" type="submit" value="Login">
                    <input type="hidden" name="Domain" value="icqmail.com">

                    <p class="support">
                        <a class="support_link link" href="http://www.icq.com/support/">
                            Can't log in?
                        </a>
                    </p>
                    <p class="support_settings">
                        <a class="settings_link link" href="http://www.icqmail.com/settings/">
                            <span class="text_emp">NEW!</span> POP/IMAP settings
                        </a>
                    </p>
                </form>
            </div>
        </div>
    </div>

</div>



</body></html>
