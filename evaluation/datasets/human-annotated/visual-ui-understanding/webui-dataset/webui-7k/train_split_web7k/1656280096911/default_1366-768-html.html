<script type="text/javascript">
	var vmi18n=$.i18n;
	$(function() {
		var lan;
		lan = getCookie("cmec_language");
		if (lan == null || lan === undefined) {
		    debugger;
            //判断访问终端
            var browser={
                versions: function () {
                    var u = navigator.userAgent,
                        app = navigator.appVersion
                    return { // 移动终端浏览器版本信息
                        trident: u.indexOf('Trident') > -1, // IE内核
                        presto: u.indexOf('Presto') > -1, // opera内核
                        webKit: u.indexOf('AppleWebKit') > -1, // 苹果、谷歌内核
                        gecko: u.indexOf('Gecko') > -1 && u.indexOf('KHTML') == -1, // 火狐内核
                        mobile: !!u.match(/AppleWebKit.*Mobile.*/)||!!u.match(/AppleWebKit/), // 是否为移动终端
                        ios: !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/), // ios终端
                        android: u.indexOf('Android') > -1 || u.indexOf('Linux') > -1, // android终端或者uc浏览器
                        iPhone: u.indexOf('iPhone') > -1 || u.indexOf('Mac') > -1, // 是否为iPhone或者QQ HD浏览器
                        iPad: u.indexOf('iPad') > -1, // 是否iPad
                        webApp: u.indexOf('Safari') == -1 // 是否web应该程序，没有头部与底部
                    }
                }(),
                language: (navigator.language || navigator.browserLanguage).toLowerCase()
            }
            if(browser.language.indexOf('zh')>-1){
                lan="zh_CN";
            }else if(browser.language.indexOf('en')>-1){
                lan="en_US";
            }else{
                lan="zh_CN";
            }
		}
		else
		{
			if(lan=="en_US")
			{
				//隐藏英文 显示中文
				$("#English").addClass("hide");
				$("#Chinese").removeClass("hide");
			}
			else if(lan=="zh_CN")
			{
				$("#English").removeClass("hide");
				$("#Chinese").addClass("hide");
			}
		}
		vmi18n.properties({
			name: 'web',
			path: ctxStatic + "/new/i18n/",
			mode: 'map',
			language: lan,
			callback: function () {
				$("[data-locale]").each(function () {
					var a = $(this).text();
					$(this).html(vmi18n.prop($(this).data("locale")));
				});
				$('input').each(function (){
					if(($(this).attr("placeholder"))!=undefined&&($(this).attr("placeholder-locale"))!=undefined){
						$(this).attr("placeholder",vmi18n.prop($(this).attr("placeholder-locale")));
					}
					if(($(this).attr("button-locale"))!=undefined){
                        $(this).val(vmi18n.prop($(this).attr("button-locale")));
                    }
				});
                $('textarea').each(function (){
                    if(($(this).attr("placeholder"))!=undefined&&($(this).attr("placeholder-locale"))!=undefined){
                        $(this).attr("placeholder",vmi18n.prop($(this).attr("placeholder-locale")));
                    }
                });
                $("[data-localize]").each(function() {
                    var elem = $(this),
                        localizedValue = jQuery.i18n.map[elem.data("localize")];
                    //alert(elem[0].previousSibling);
                    if (elem.is("input[type=textarea]") || elem.is("input[type=text]") || elem.is("input[type=password]") || elem.is("input[type=email]")) {
                        elem.attr("placeholder", localizedValue);
                    } else if (elem.is("input[type=button]") || elem.is("input[type=submit]")) {
                        elem.attr("value", localizedValue);
                    } else {
                        elem.text(localizedValue);
                    }
                });
			}
		});
	});
	function getCookie(name) {
			var arr, reg = new RegExp("(^| )" + name + "=([^;]*)(;|$)");
			if (arr = document.cookie.match(reg)) {
				return unescape(arr[2]);
			}
			return null;
	}
	function loadPropertiesalert(alsss){
		var lan;
		lan = getCookie("cmec_language");
		if (lan == null || lan === undefined) {
			lan = "zh_CN"
		}
		vmi18n.properties({
			name:'js',
			path:ctxStatic + "/new/i18n/",
			mode:'map',
			language:lan,
			callback:function(){
				vel=vmi18n.prop(alsss);
			}
		});
		return vel;
	}

</script>
