<html><head><script language="JavaScript">
//purpose:		function trim trims left and right spaces in a string
//parameters:	string str
//returns:		trimmed string
function trim(str)
{
	var str_beg=0;
	var str_end=str.length-1;
	while (str.charAt(str_beg)==" " && (str_beg != str_end))	{
		str_beg++;
	}
	while (str.charAt(str_end)==" " && (str_beg != str_end))	{
		str_end--;
	}
	if (str_beg == str_end && str.charAt(str_beg)==" ") {
	   return ""
   }
   else {
	   return str.substring(str_beg, str_end+1);
	}
} 
</script>

<script>

/**
* Checks that the format of the date field is in YYYY/MM/DD
* as well as replacing the common "-" with "/" as the seperator
*/
function handleDateField(date_field) {
	var errors = document.getElementById("date_error");
	var current_value = date_field.value;
	var field_wrapper = document.getElementById(date_field.getAttribute('data-question'));

	//replace any "-" characters with "/" since we need it in that format
	current_value = current_value.replace(/(-)/gm, "/");
	date_field.value = current_value;

	//get a clean version of the current value for checking
	var char_check = /[^0-9\/]/gm;
	var clean_value = current_value.replace(char_check, "");

	//reset the error element
	errors.innerHTML = "";
	field_wrapper.className = "";

	//let's check for anything that indicates this format is incorrect:
	//	if the length of the entire string is more than 10
	//	if on exploding on "/" there are not 3 parts (YYYY/MM/DD)
	//	if the length of the first part is less than 4 characters (YYYY)
	//	if the second element exceeds 12 (MM)
	//	if the last element is more than 31 (DD)
	// does not check any strings less than 10, since it assumes the user is still typing

	if (current_value.length >= 10) {
		if (current_value !== clean_value || current_value.length > 10) {
			errors.innerHTML = "Please check that the date entered is in the format YYYY/MM/DD.";
			field_wrapper.className = "error";
		} else {
			var explode_value = current_value.split("/");
			if (explode_value.length < 3 || explode_value[0].length !== 4
				|| Number(explode_value[1]) > 12 || Number(explode_value[2]) > 31) {

				errors.innerHTML = "Please check that the date entered is in the format YYYY/MM/DD.";
				field_wrapper.className = "error";
			}
		}
	}
} //end function: handleDateField


/**
* Takes the value of the email field and populates the unm field
* for excite users to be their email address.
*/
function handleExciteEmail(email_field) {
	var unm_field = document.getElementById("unm");
	var current_email = email_field.value;
	var email_explode = current_email.split("@"); //incase they entered entire email
	var email_username = email_explode[0] || current_email || "";
	unm_field.value = email_username + "@excite.com";
} //end function: handleExciteEmail

/**
* https://stackoverflow.com/questions/36639681/how-to-copy-text-from-a-div-to-clipboard
*/
function CopyToClipboard(containerid) {
	var new_pwd = document.getElementById(containerid);
	if (document.selection) {
		var range = document.body.createTextRange();
		range.moveToElementText(new_pwd);
		range.select().createTextRange();
		document.execCommand("copy");
	} else if (window.getSelection) {
		var range = document.createRange();
		range.selectNode(new_pwd);
		window.getSelection().addRange(range);
		document.execCommand("copy");
	}
}



</script>
