    var rotation = 0;
    var interval;
    var gear = $('#rotate-this');
    
    function animate() {
        gear.css('transform', 'rotate('+rotation+'deg)');
        rotation += 3;
        rotation %= 360;

    function startAnim() {
        if (!interval) {
            interval = setInterval(animate, 50);

    function stopAnim() {
        clearInterval(interval);
        interval = null;
    }    
    $(document).scroll(startAnim).mouseup(stopAnim);
