<!DOCTYPE html><html><head>
  <title>Hackware SpA</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <style type="text/css">
    body {
      text-align: center;
      background-color: #001a0c;
      color: #fff;
      font: 10pt normal monospace;
    }
    a {
      color: #005e2b;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    li {
      list-style-type: none;
    }
    li > ul {
      padding: 0;
    }
    .form_row {
      text-align: left;
      width: 50%;
      margin: 0 auto 1em;
    }
    .form_row input, .form_row textarea {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.5);
      border: 0;
      padding: 5px;
    }
    .form_row textarea {
      height: 5em;
    }
    .submit_btn {
      border: 0;
      background-color: #005e2b;
      color: #ffffff;
      padding: 10px;
    }
    @media only screen and (max-width: 600px) {
      .form_row {
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <a href="/"><img src="../logo.png" alt="Logo"></a>
  <h1>Hackware SpA</h1>
  <h2>Contact</h2>
      <p>* mandatory fields</p>
    <form method="post" action="">
      <div class="form_row">
        <label>Name *</label>
        <input type="text" name="name" required="">
      </div>
      <div class="form_row">
        <label>Email *</label>
        <input type="text" name="email" required="">
      </div> 	
      <div class="form_row">
        <label>Phone</label>
        <input type="text" name="phone">
      </div>	
      <div class="form_row">
        <label>Message *</label>
        <textarea name="message" required=""></textarea>
      </div>
      <input type="hidden" name="subject">
      <input type="submit" name="submit" class="submit_btn" value="Send message">
    </form>
  

</body></html>
