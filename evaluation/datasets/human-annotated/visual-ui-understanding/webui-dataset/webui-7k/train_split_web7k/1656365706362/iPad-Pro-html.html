<script>
$(function(){
	$("#userreg").click(function(){
		if($('#username').val()==""){
			alert('请输入用户名', '', function () {$("#username").focus();});
			return false;
		}

		var username = $("#username").val();
		var uservalid = 1;
		$.ajax({url: "cf.aspx",type: "get",async: false,data:"action=usernamechecksave&username="+username,success: function(response){
		if(response.indexOf("error")>=0){
			uservalid=0;
		}
		}});
		if(uservalid==0){ 
			alert('此用户名已经被其它人注册', '', function () {$("#username").focus();});
			return false;
		}
		
		if($('#pwd').val()==""){
			alert('请输入密码', '', function () {$("#pwd").focus();});
		return false;
		}else{
			$("#pwd2").val($('#pwd').val());//给必填项重复密码一个默认值
		}

		if($('#regcheckcode').val()==""){
			alert('请输入验证码', '', function () {$("#regcheckcode").focus();});
			return false;
		}

		var checkcode = $("#checkcode").val();
		var checkvalid = 1;
		$.ajax({url: "cf.aspx",type: "get",async: false,data:"action=checkcodechecksave&checkcode="+checkcode,success: function(response){
		if(response.indexOf("error")>=0){
			checkvalid=0;
		}
		}});
		if(checkvalid==0){ 
			alert('验证码输入错误', '', function () {$("#checkcode").focus();});
			return false;
		}

		if(!$("#agreeprotocol").is(":checked")){ 
			alert('同意协议才能注册用户', '', function () {$("#agreeprotocol").focus();});
			$('#agreeprotocol').focus();
			return false;
		}
		
		$("#email").val($('#username').val()+'@a.com');//给必填项email一个默认值

		$('#form_userreg').submit();

		return true;
	});


	$("#usertype_1").click(function(){
		$("#usertype").val(1);
		$(usertype_1).addClass('on');
		$(usertype_2).removeClass('on');
	});
	
	$("#usertype_2").click(function(){
		$("#usertype").val(2);
		$(usertype_2).addClass('on');
		$(usertype_1).removeClass('on');
	});
	
	$("#ccimg").click(function(){
		$("#ccimg").attr('src','CF.aspx?Action=checkcodeget&RanStr=' + Math.random());
	});
});
</script>
